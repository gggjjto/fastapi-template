repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this aligned with the exact Ruff version resolved in apps/api/uv.lock.
    rev: v0.16.2
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Whole-app check (matches CI typecheck job); keeps commits from landing obvious type errors.
  - repo: local
    hooks:
      - id: harness-check
        name: repository Harness guard
        entry: python3 scripts/check_ai_workflow.py
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy (app)
        entry: bash -lc 'cd apps/api && uv run mypy app'
        language: system
        pass_filenames: false
