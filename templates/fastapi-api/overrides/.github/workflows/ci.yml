name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  UV_NO_PROGRESS: "1"
  UV_SYSTEM_PYTHON: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --dev --frozen
        working-directory: apps/api
      - run: uv run ruff check .
        working-directory: apps/api
      - run: uv run ruff format --check .
        working-directory: apps/api
      - run: uv run mypy app
        working-directory: apps/api
      - run: make harness-check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_test
      APP_REDIS_URL: redis://localhost:6379/0
      APP_DB_CREATE_TABLES_ON_STARTUP: "false"
      APP_JWT_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --dev --frozen
        working-directory: apps/api
      - run: uv run pytest --cov --cov-report=term-missing
        working-directory: apps/api

  migrations:
    name: Alembic Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app
      APP_DB_CREATE_TABLES_ON_STARTUP: "false"
      APP_JWT_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --dev --frozen
        working-directory: apps/api
      - run: uv run alembic upgrade head
        working-directory: apps/api
      - run: uv run alembic downgrade base
        working-directory: apps/api

  docker-build:
    name: Docker Build (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: false
          load: true
          tags: fastapi-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run --rm \
            -e APP_ENV=test \
            -e APP_JWT_SECRET=ci-smoke \
            -e APP_DATABASE_URL="sqlite+aiosqlite:///./smoke.db" \
            -e APP_DB_CREATE_TABLES_ON_STARTUP=true \
            fastapi-template:ci python -c "from app.main import app; print(app.title)"
